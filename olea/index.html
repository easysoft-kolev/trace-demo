<style>
/* Layout: a phone-first menu card — limestone page, olive ink, a sticky row of course tabs, dishes set like a printed menu with dotted leaders to the portion weight. */
:root {
  --bg: #f2f3ec;          /* limestone with an olive bias */
  --surface: #fbfbf7;
  --ink: #1d2419;
  --muted: #5f6857;
  --line: #d5d9c8;
  --olive: #56622a;
  --olive-soft: #e3e7cf;
  --sea: #2c6772;
  --sea-soft: #dcebec;
  --amber: #8a5a12;
  --amber-soft: #f3e6cc;
  --ribbon: #1d2419;
  --ribbon-ink: #eef0e4;
  --font-display: "Prata", "Georgia", "Times New Roman", serif;
  --font-body: "Golos Text", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12160f; --surface: #191e15; --ink: #e7eadc; --muted: #a2aa93; --line: #313a29;
    --olive: #b9c77d; --olive-soft: #2a3220; --sea: #8cc5cd; --sea-soft: #1d3034;
    --amber: #e3b56a; --amber-soft: #382c17; --ribbon: #e7eadc; --ribbon-ink: #12160f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12160f; --surface: #191e15; --ink: #e7eadc; --muted: #a2aa93; --line: #313a29;
  --olive: #b9c77d; --olive-soft: #2a3220; --sea: #8cc5cd; --sea-soft: #1d3034;
  --amber: #e3b56a; --amber-soft: #382c17; --ribbon: #e7eadc; --ribbon-ink: #12160f;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--sea); outline-offset: 2px; }

.gutter {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.col { max-width: 640px; margin: 0 auto; }

/* demo ribbon */
.ribbon { background: var(--ribbon); color: var(--ribbon-ink); font-size: 12.5px; line-height: 1.45; }
.ribbon .col { padding-block: 9px; display: flex; gap: 10px; align-items: baseline; }
.ribbon b { letter-spacing: .08em; text-transform: uppercase; font-size: 11px; font-weight: 600; flex: none; }

/* masthead */
.mast .col { padding-block: 28px 18px; display: grid; gap: 14px; }
.mast-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.eyebrow { font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(44px, 13vw, 64px); line-height: .95; margin: 0; letter-spacing: .01em; text-wrap: balance; }
.lede { margin: 0; color: var(--muted); max-width: 46ch; }
.tools { display: flex; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--surface); }
.seg button { border: 0; background: none; padding: 5px 11px; border-radius: 999px; font-size: 13px; font-weight: 500; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.qr-btn { border: 1px solid var(--ink); background: var(--ink); color: var(--bg); border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; gap: 7px; align-items: center; }
.qr-btn svg { width: 15px; height: 15px; }

.find { display: grid; gap: 10px; }
.search { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 11px 14px; font-size: 15px; }
.search::placeholder { color: var(--muted); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer; color: var(--ink); }
.chip[aria-pressed="true"] { border-color: var(--olive); background: var(--olive-soft); color: var(--olive); font-weight: 600; }

/* sticky course tabs */
.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.tabs-scroll { overflow-x: auto; scrollbar-width: none; }
.tabs-scroll::-webkit-scrollbar { display: none; }
.tabs ul { list-style: none; margin: 0 auto; padding: 0; display: flex; gap: 2px; max-width: 640px; }
.tabs a { display: block; white-space: nowrap; padding: 11px 10px 10px; font-size: 13.5px; color: var(--muted); text-decoration: none; border-bottom: 2px solid transparent; }
.tabs a[aria-current="true"] { color: var(--ink); border-bottom-color: var(--olive); font-weight: 600; }

/* menu */
main .col { padding-block: 8px 24px; }
.course { padding-top: 26px; scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 52px); }
.course h2 { font-family: var(--font-display); font-weight: 400; font-size: 26px; margin: 0 0 2px; text-wrap: balance; }
.course .note { margin: 0 0 6px; color: var(--muted); font-size: 13.5px; }
.dishes { display: grid; }
.dish { padding: 13px 0; border-bottom: 1px solid var(--line); display: grid; gap: 4px; }
.dish:last-child { border-bottom: 0; }
.row { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.dish h3 { margin: 0; font-size: 15.5px; font-weight: 600; line-height: 1.35; min-width: 0; }
.leader { flex: 1 1 24px; min-width: 18px; border-bottom: 1.5px dotted var(--line); transform: translateY(-4px); }
.meta { flex: none; display: flex; gap: 10px; align-items: baseline; font-variant-numeric: tabular-nums; }
.grams { color: var(--muted); font-size: 13px; }
.price { font-weight: 600; font-size: 14px; color: var(--muted); }
.desc { margin: 0; color: var(--muted); font-size: 13.5px; max-width: 58ch; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
.tag { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
.tag.sea { background: var(--sea-soft); color: var(--sea); }
.tag.veg { background: var(--olive-soft); color: var(--olive); }
.tag.aged { background: var(--amber-soft); color: var(--amber); }
.callout { font-size: 13px; color: var(--amber); font-weight: 500; }
.empty { padding: 40px 0; text-align: center; color: var(--muted); }

/* for the restaurant */
.owner { border-top: 1px solid var(--line); background: var(--surface); }
.owner .col { padding-block: 28px 36px; display: grid; gap: 16px; }
.owner h2 { font-family: var(--font-display); font-weight: 400; font-size: 24px; margin: 0; }
.owner ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 12px; counter-reset: s; }
.owner li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; min-width: 0; }
.owner li::before { counter-increment: s; content: counter(s); width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--olive); color: var(--olive); display: grid; place-items: center; font-size: 13px; font-weight: 600; }
.owner li p { margin: 0; }
.owner li strong { display: block; }
.owner .sig { color: var(--muted); font-size: 13.5px; }
.owner .sig span { user-select: all; color: var(--ink); }

/* QR table card sheet */
.sheet { position: fixed; inset: 0; z-index: 20; background: color-mix(in srgb, var(--ink) 45%, transparent); display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.card { background: var(--surface); color: var(--ink); width: min(340px, 100%); border-radius: 18px; padding: 26px 22px 20px; display: grid; gap: 12px; justify-items: center; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
.card .eyebrow { margin: 0; }
.card h3 { font-family: var(--font-display); font-weight: 400; font-size: 34px; margin: 0; line-height: 1; }
.qr-box { background: #ffffff; padding: 12px; border-radius: 10px; width: 196px; height: 196px; display: grid; place-items: center; }
.qr-box img, .qr-box canvas { display: block; width: 172px !important; height: 172px !important; }
.qr-msg { font-size: 12.5px; color: #4a4f44; padding: 8px; }
.card .scan { margin: 0; font-size: 14px; }
.card .small { margin: 0; font-size: 12px; color: var(--muted); max-width: 30ch; }
.card .close { border: 1px solid var(--line); background: none; border-radius: 999px; padding: 6px 16px; cursor: pointer; font-size: 13px; }

@media (prefers-reduced-motion: no-preference) {
  html { scroll-behavior: smooth; }
}
</style>
</head>

      ["Чийзкейк Biscoff", "Biscoff cheesecake", "Бисквити, маскарпоне, крема сирене, карамел, шоколад, кадаиф", "Biscuits, mascarpone, cream cheese, caramel, chocolate, kataifi", 150, []],
      ["Чийзкейк със солен карамел", "Salted caramel cheesecake", "Бисквити, солен карамел, лешници, маскарпоне, шоколад", "Biscuits, salted caramel, hazelnuts, mascarpone, chocolate", 150, []],

  ];

  var FILTERS = ["all", "sea", "veg", "aged"];
  var state = { lang: "bg", filter: "all", q: "" };
  try { var saved = localStorage.getItem("olea-lang"); if (saved === "en" || saved === "bg") state.lang = saved; } catch (e) {}

  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
  var norm = function (s) { return String(s).toLowerCase(); };

  function t(k) { return UI[state.lang][k]; }

  function renderStatic() {
    document.documentElement.lang = state.lang;
    $("t-demo").textContent = t("demo");
    $("t-ribbon").textContent = t("ribbon");
    $("t-eyebrow").textContent = t("eyebrow");
    $("t-name").textContent = t("name");
    $("t-card-name").textContent = t("name");
    $("t-lede").textContent = t("lede");
    $("q").placeholder = t("search");
    $("q").setAttribute("aria-label", t("search"));
    $("t-qr").textContent = t("qr");
    $("t-owner-h").textContent = t("ownerH");
    $("owner-list").innerHTML = t("owner").map(function (o) {
      return "<li><p><strong>" + esc(o[0]) + "</strong>" + esc(o[1]) + "</p></li>";
    }).join("");
    $("t-sig").innerHTML = esc(t("sig")) + "<span>ivo2005kolev@gmail.com</span>";
    $("t-card-eyebrow").textContent = t("cardEyebrow");
    $("t-scan").textContent = t("scan");
    $("qr-close").textContent = t("close");
    $("lang-bg").setAttribute("aria-pressed", String(state.lang === "bg"));
    $("lang-en").setAttribute("aria-pressed", String(state.lang === "en"));
    $("chips").innerHTML = FILTERS.map(function (f) {
      return '<button type="button" class="chip" id="f-' + f + '" data-f="' + f + '" aria-pressed="' + (state.filter === f) + '">' + esc(t(f)) + "</button>";
    }).join("");
  }

  function matches(it) {
    var tags = it[5];
    if (state.filter !== "all" && tags.indexOf(state.filter) < 0) return false;
    if (!state.q) return true;
    var hay = norm([it[0], it[1], it[2], it[3]].join(" "));
    return hay.indexOf(norm(state.q)) >= 0;
  }

  function renderMenu() {
    var L = state.lang, i = L === "bg" ? 0 : 1, d = L === "bg" ? 2 : 3;
    var html = "", tabs = "";
    MENU.forEach(function (sec) {
      var items = sec.items.filter(matches);
      if (!items.length) return;
      tabs += '<li><a href="#' + sec.id + '" data-sec="' + sec.id + '">' + esc(sec[L]) + "</a></li>";
      html += '<section class="course" id="' + sec.id + '"><h2>' + esc(sec[L]) + "</h2>";
      if (sec.note) html += '<p class="note">' + esc(sec.note[L]) + "</p>";
      html += '<div class="dishes">';
      items.forEach(function (it) {
        var tags = it[5].map(function (tg) {
          var label = tg === "sea" ? t("tagSea") : tg === "veg" ? t("tagVeg") : t("tagAged");
          return '<span class="tag ' + tg + '">' + esc(label) + "</span>";
        }).join("");
        html += '<article class="dish"><div class="row"><h3>' + esc(it[i]) + '</h3><span class="leader" aria-hidden="true"></span>' +
          '<span class="meta"><span class="grams">' + it[4] + esc(t("grams")) + '</span><span class="price" title="">€&nbsp;–</span></span></div>' +
          (it[d] ? '<p class="desc">' + esc(it[d]) + "</p>" : "") +
          (it[6] === "catch" ? '<p class="desc callout">' + esc(t("catch")) + "</p>" : "") +
          (tags ? '<div class="tags">' + tags + "</div>" : "") + "</article>";
      });
      html += "</div></section>";
    });
    if (!html) html = '<p class="empty">' + esc(t("empty").replace("{q}", state.q)) + "</p>";
    $("menu").innerHTML = html;
    $("tabs").innerHTML = tabs;
    spy();
  }

  function spy() {
    var secs = Array.prototype.slice.call(document.querySelectorAll(".course"));
    var y = window.scrollY + 120, cur = secs.length ? secs[0].id : "";
    secs.forEach(function (s) { if (s.offsetTop <= y) cur = s.id; });
    Array.prototype.forEach.call(document.querySelectorAll(".tabs a"), function (a) {
      var on = a.getAttribute("data-sec") === cur;
      a.setAttribute("aria-current", String(on));
      if (on && a.scrollIntoView && a.parentNode && a.parentNode.parentNode) {
        var box = a.closest(".tabs-scroll"), r = a.getBoundingClientRect(), b = box.getBoundingClientRect();
        if (r.left < b.left || r.right > b.right) box.scrollLeft += r.left - b.left - 16;
      }
    });
  }

  function setLang(l) {
    state.lang = l;
    try { localStorage.setItem("olea-lang", l); } catch (e) {}
    renderStatic(); renderMenu();
  }

  var qrMade = false;
  function openQR() {
    $("sheet").hidden = false;
    var online = /^https?:$/.test(location.protocol);
    $("t-card-small").textContent = online ? t("cardSmall") : t("cardLocal");
    if (!qrMade) {
      var box = $("qr-box");
      var url = location.href.split("#")[0];
      if (online && window.QRCode) {
        box.innerHTML = "";
        new window.QRCode(box, { text: url, width: 172, height: 172, colorDark: "#1d2419", colorLight: "#ffffff", correctLevel: window.QRCode.CorrectLevel.M });
        qrMade = true;
      } else {
        box.innerHTML = '<span class="qr-msg">' + esc(online ? "QR" : t("cardLocal")) + "</span>";
      }
    }
    $("qr-close").focus();
  }
  function closeQR() { $("sheet").hidden = true; $("qr-open").focus(); }

  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-lang]");
    if (b) { setLang(b.getAttribute("data-lang")); return; }
    var f = e.target.closest("[data-f]");
    if (f) { state.filter = f.getAttribute("data-f"); renderStatic(); renderMenu(); return; }
    if (e.target.closest("#qr-open")) { openQR(); return; }
    if (e.target.closest("#qr-close") || e.target === $("sheet")) { closeQR(); }
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("sheet").hidden) closeQR(); });
  $("q").addEventListener("input", function (e) { state.q = e.target.value.trim(); renderMenu(); });
  window.addEventListener("scroll", function () { window.requestAnimationFrame(spy); }, { passive: true });

  renderStatic();
  renderMenu();
})();
</script>
